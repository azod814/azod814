<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Support Suryansh</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          rgba(5, 5, 10, 0.60),
          rgba(5, 5, 10, 0.78)
        ),
        url("back.gif");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      color: #fff;
      padding: 25px;
      overflow-x: hidden;
    }

    /* ---------- BACKGROUND GLOW ---------- */

    body::before {
      content: "";
      position: fixed;
      width: 450px;
      height: 450px;
      background: rgba(163, 113, 247, 0.16);
      filter: blur(120px);
      border-radius: 50%;
      top: -150px;
      left: -120px;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      width: 400px;
      height: 400px;
      background: rgba(100, 70, 200, 0.12);
      filter: blur(120px);
      border-radius: 50%;
      bottom: -150px;
      right: -100px;
      pointer-events: none;
    }

    /* ---------- MAIN CARD ---------- */

    .wrapper {
      width: 100%;
      max-width: 470px;

      position: relative;
      z-index: 2;

      animation: cardIn 0.9s ease forwards;
    }

    .card {
      position: relative;

      padding: 34px 30px 28px;

      border-radius: 28px;

      background: rgba(13, 13, 20, 0.72);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      border: 1px solid rgba(255, 255, 255, 0.13);

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);

      overflow: hidden;
    }

    .card::before {
      content: "";

      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        #a371f7,
        transparent
      );

      opacity: 0.8;
    }

    /* ---------- HEADER ---------- */

    .icon {
      width: 64px;
      height: 64px;

      margin: 0 auto 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background: linear-gradient(
        135deg,
        rgba(163, 113, 247, 0.25),
        rgba(163, 113, 247, 0.07)
      );

      border: 1px solid rgba(163, 113, 247, 0.35);

      font-size: 31px;

      box-shadow:
        0 0 35px rgba(163, 113, 247, 0.18);

      animation: float 3s ease-in-out infinite;
    }

    h1 {
      text-align: center;

      font-size: 29px;
      font-weight: 700;

      letter-spacing: -0.6px;

      margin-bottom: 8px;
    }

    .typing {
      min-height: 23px;

      text-align: center;

      color: #bcb8c7;

      font-size: 14px;

      margin-bottom: 28px;
    }

    .cursor {
      color: #a371f7;
      animation: blink 0.8s infinite;
    }

    /* ---------- SUPPORT OPTIONS ---------- */

    .label {
      font-size: 12px;
      color: #85818f;

      text-transform: uppercase;
      letter-spacing: 1.4px;

      margin-bottom: 10px;
    }

    .amounts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .amount {
      position: relative;

      padding: 15px 8px;

      border-radius: 15px;

      border: 1px solid rgba(255,255,255,0.10);

      background: rgba(255,255,255,0.045);

      color: white;

      cursor: pointer;

      font-size: 14px;
      font-weight: 600;

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        border 0.25s ease,
        box-shadow 0.25s ease;
    }

    .amount:hover {
      transform: translateY(-3px);

      border-color: rgba(163,113,247,0.45);

      background: rgba(163,113,247,0.10);
    }

    .amount.active {
      transform: translateY(-2px);

      background: linear-gradient(
        135deg,
        rgba(163,113,247,0.32),
        rgba(163,113,247,0.12)
      );

      border-color: rgba(163,113,247,0.65);

      box-shadow:
        0 8px 25px rgba(163,113,247,0.15);
    }

    /* ---------- CUSTOM AMOUNT ---------- */

    .custom {
      margin-top: 12px;
    }

    .custom input {
      width: 100%;

      padding: 14px 16px;

      border-radius: 15px;

      border: 1px solid rgba(255,255,255,0.10);

      background: rgba(0,0,0,0.22);

      outline: none;

      color: white;

      font-size: 15px;

      text-align: center;

      transition: 0.25s;
    }

    .custom input:focus {
      border-color: rgba(163,113,247,0.6);

      box-shadow:
        0 0 0 3px rgba(163,113,247,0.08);
    }

    .custom input::placeholder {
      color: #77727f;
    }

    /* ---------- SELECTED AMOUNT ---------- */

    .selected {
      text-align: center;

      color: #8e8998;

      font-size: 13px;

      margin: 21px 0 13px;
    }

    .selected strong {
      color: #d8c8f5;
    }

    /* ---------- QR ---------- */

    .qr-wrapper {
      display: flex;
      justify-content: center;

      margin: 0 auto 18px;
    }

    .qr-box {
      width: 225px;
      height: 225px;

      padding: 12px;

      background: #ffffff;

      border-radius: 21px;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 15px 45px rgba(0,0,0,0.40);

      animation: qrIn 0.4s ease;
    }

    .qr-box img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;
    }

    /* ---------- PAY BUTTON ---------- */

    .pay-btn {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;

      padding: 15px;

      border-radius: 15px;

      background: linear-gradient(
        135deg,
        #a371f7,
        #8755df
      );

      color: white;

      font-size: 15px;
      font-weight: 700;

      text-decoration: none;

      border: 1px solid rgba(255,255,255,0.12);

      box-shadow:
        0 10px 30px rgba(163,113,247,0.20);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .pay-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 14px 35px rgba(163,113,247,0.32);
    }

    /* ---------- FOOTER ---------- */

    .note {
      text-align: center;

      color: #686472;

      font-size: 11px;

      margin-top: 18px;

      line-height: 1.5;
    }

    .brand {
      color: #a371f7;
    }

    /* ---------- ANIMATIONS ---------- */

    @keyframes cardIn {

      from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    }

    @keyframes qrIn {

      from {
        opacity: 0;
        transform: scale(0.94);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }

    @keyframes float {

      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }

    }

    @keyframes blink {

      0%,100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }

    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 520px) {

      body {
        padding: 14px;
      }

      .card {
        padding: 28px 20px 23px;
        border-radius: 23px;
      }

      h1 {
        font-size: 25px;
      }

      .qr-box {
        width: 205px;
        height: 205px;
      }

    }

  </style>
</head>

<body>

  <div class="wrapper">

    <div class="card">

      <div class="icon">
        ☕
      </div>

      <h1>Support My Work</h1>

      <p class="typing">
        <span id="typingText"></span><span class="cursor">|</span>
      </p>

      <div class="label">
        Choose your support
      </div>

      <div class="amounts">

        <button
          class="amount active"
          onclick="setAmount(49, this)">
          ☕ ₹49
        </button>

        <button
          class="amount"
          onclick="setAmount(99, this)">
          ❤️ ₹99
        </button>

        <button
          class="amount"
          onclick="setAmount(199, this)">
          🚀 ₹199
        </button>

      </div>

      <div class="custom">

        <input
          type="number"
          id="customAmount"
          placeholder="Enter custom amount"
          min="1"
          oninput="customAmount()"
        >

      </div>

      <p class="selected">
        Supporting with
        <strong id="amountText">₹49</strong>
      </p>

      <div class="qr-wrapper">

        <div class="qr-box">

          <img
            id="qr"
            src=""
            alt="UPI Payment QR Code"
          >

        </div>

      </div>

      <a
        id="payButton"
        class="pay-btn"
        href="#">

        Pay ₹49

      </a>

      <p class="note">

        Every bit of support helps me build more
        <span class="brand">tools, labs & content.</span>

      </p>

    </div>

  </div>


  <script>

    /* ================================
       PRIVATE UPI CONFIGURATION
       ================================ */

    const UPI_ID = "xazod444@oksbi";

    const NAME = "Suryansh Sharma";

    let currentAmount = 49;


    /* ================================
       TYPING ANIMATION
       ================================ */

    const messages = [
      "Supporting independent creators ❤️",
      "Helping me build better tools 🔐",
      "Fueling new cybersecurity projects 🚀"
    ];

    let messageIndex = 0;
    let charIndex = 0;
    let deleting = false;

    const typingElement =
      document.getElementById("typingText");


    function typeText() {

      const currentMessage =
        messages[messageIndex];

      if (!deleting) {

        typingElement.textContent =
          currentMessage.substring(
            0,
            charIndex + 1
          );

        charIndex++;

        if (charIndex === currentMessage.length) {

          deleting = true;

          setTimeout(typeText, 1700);

          return;
        }

      } else {

        typingElement.textContent =
          currentMessage.substring(
            0,
            charIndex - 1
          );

        charIndex--;

        if (charIndex === 0) {

          deleting = false;

          messageIndex =
            (messageIndex + 1) % messages.length;

        }

      }

      setTimeout(
        typeText,
        deleting ? 35 : 55
      );
    }

    typeText();


    /* ================================
       PAYMENT / QR
       ================================ */

    function updatePayment(amount) {

      if (!amount || amount < 1) {
        return;
      }

      currentAmount = amount;

      document.getElementById("amountText")
        .textContent = "₹" + amount;

      document.getElementById("payButton")
        .textContent = "Pay ₹" + amount;


      /*
        UPI PAYMENT URI
      */

      const upiURL =
        "upi://pay" +
        "?pa=" +
        encodeURIComponent(UPI_ID) +

        "&pn=" +
        encodeURIComponent(NAME) +

        "&am=" +
        encodeURIComponent(amount) +

        "&cu=INR";


      /*
        QR generated from the UPI URI.
        QR itself stays clear and unblurred.
      */

      const qrURL =
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=600x600" +
        "&margin=10" +
        "&data=" +
        encodeURIComponent(upiURL);


      const qr =
        document.getElementById("qr");

      qr.src = qrURL;


      /*
        Mobile:
        opens UPI application.
      */

      document.getElementById("payButton")
        .href = upiURL;


      /*
        QR refresh animation.
      */

      const box =
        document.querySelector(".qr-box");

      box.style.animation = "none";

      void box.offsetWidth;

      box.style.animation =
        "qrIn 0.4s ease";
    }


    /* ================================
       PRESET AMOUNTS
       ================================ */

    function setAmount(amount, button) {

      document
        .querySelectorAll(".amount")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      button.classList.add("active");

      document.getElementById("customAmount")
        .value = "";

      updatePayment(amount);
    }


    /* ================================
       CUSTOM AMOUNT
       ================================ */

    function customAmount() {

      const value =
        document.getElementById("customAmount")
          .value;

      if (
        value &&
        Number(value) > 0
      ) {

        document
          .querySelectorAll(".amount")
          .forEach(btn =>
            btn.classList.remove("active")
          );

        updatePayment(
          Number(value)
        );

      }

    }


    /* ================================
       INITIAL QR
       ================================ */

    updatePayment(49);

  </script>

</body>
</html>
